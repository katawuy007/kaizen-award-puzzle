[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Cache optimized WebP puzzle artwork & hashed JS/CSS aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA fallback so all routes load index.html cleanly
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
